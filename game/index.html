<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERDECK — Your deck is your town's wall.</title>
<style>
  html, body { margin: 0; padding: 0; background: #1c2433; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Verdana, sans-serif; }
  canvas { width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; background: #f7ead0; image-rendering: auto; }
  #status { color: #f7ead0; font-size: 13px; padding: 6px; min-height: 18px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberdeck game board"></canvas>
<div id="status" aria-live="polite"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
